<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">M01 从模糊请求到 READY 任务卡</title>
  <desc id="desc">原始请求经过明确字段提取、缺失检查、澄清问题、人工确认，形成 READY 任务卡和运行记录。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17202e" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8998"/>
    </marker>
    <style>
      .title { font: 700 50px Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #17202e; }
      .subtitle { font: 400 24px Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #5f6b7a; }
      .label { font: 700 25px Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #17202e; }
      .body { font: 400 20px Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #5f6b7a; }
      .small { font: 600 16px Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .mono { font: 500 18px 'SFMono-Regular', Consolas, monospace; fill: #344054; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#eef2f6"/>
  <rect x="56" y="48" width="1488" height="804" rx="28" fill="#ffffff" filter="url(#shadow)"/>

  <text x="110" y="130" class="title">从一条模糊需求开始</text>
  <text x="110" y="174" class="subtitle">先把未知暴露出来，再让人确认任务可以开始</text>

  <!-- Main flow -->
  <g transform="translate(105 245)">
    <rect x="0" y="0" width="245" height="205" rx="20" fill="#eaf1ff" stroke="#8bb0f6" stroke-width="2"/>
    <text x="24" y="45" class="label">原始请求</text>
    <text x="24" y="86" class="body">“请把上个月收到的</text>
    <text x="24" y="116" class="body">用户问题整理一下，</text>
    <text x="24" y="146" class="body">下周评审时用。”</text>
    <rect x="24" y="164" width="102" height="26" rx="13" fill="#2f6fed"/>
    <text x="75" y="183" text-anchor="middle" class="small" fill="#ffffff">SOURCE_TEXT</text>

    <line x1="260" y1="102" x2="335" y2="102" stroke="#7d8998" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="350" y="0" width="245" height="205" rx="20" fill="#ffffff" stroke="#d9e1ea" stroke-width="2"/>
    <text x="374" y="45" class="label">候选任务卡</text>
    <text x="374" y="86" class="mono">objective ✓</text>
    <text x="374" y="117" class="mono">time text ✓</text>
    <text x="374" y="148" class="mono">source —</text>
    <text x="374" y="179" class="mono">owner —</text>

    <line x1="610" y1="102" x2="685" y2="102" stroke="#7d8998" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="700" y="0" width="245" height="205" rx="20" fill="#fff5df" stroke="#e3ad51" stroke-width="2"/>
    <text x="724" y="45" class="label">缺失检查</text>
    <text x="724" y="86" class="body">来源、日期、输出</text>
    <text x="724" y="116" class="body">负责人、验收条件</text>
    <rect x="724" y="148" width="192" height="36" rx="18" fill="#b76a00"/>
    <text x="820" y="173" text-anchor="middle" class="small" fill="#ffffff">NEEDS_CLARIFICATION</text>

    <line x1="960" y1="102" x2="1035" y2="102" stroke="#7d8998" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="1050" y="0" width="245" height="205" rx="20" fill="#ffffff" stroke="#d9e1ea" stroke-width="2"/>
    <text x="1074" y="45" class="label">澄清问题</text>
    <text x="1074" y="86" class="body">数据在哪里？</text>
    <text x="1074" y="116" class="body">哪天截止？</text>
    <text x="1074" y="146" class="body">谁负责？</text>
    <text x="1074" y="176" class="body">怎样算完成？</text>
  </g>

  <!-- Second row -->
  <g transform="translate(290 540)">
    <rect x="0" y="0" width="300" height="170" rx="20" fill="#e8f6ed" stroke="#7cc093" stroke-width="2"/>
    <text x="28" y="46" class="label">人工确认</text>
    <text x="28" y="84" class="body">确认具体日期、负责人、</text>
    <text x="28" y="114" class="body">输出形式与验收条件</text>
    <rect x="28" y="130" width="166" height="26" rx="13" fill="#287a4b"/>
    <text x="111" y="149" text-anchor="middle" class="small" fill="#ffffff">HUMAN_CONFIRMED</text>

    <line x1="315" y1="85" x2="425" y2="85" stroke="#7d8998" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="440" y="0" width="300" height="170" rx="20" fill="#e8f6ed" stroke="#7cc093" stroke-width="2"/>
    <text x="468" y="46" class="label">READY 任务卡</text>
    <text x="468" y="84" class="body">必填信息已确认</text>
    <text x="468" y="114" class="body">可进入执行准备</text>
    <rect x="468" y="130" width="88" height="26" rx="13" fill="#287a4b"/>
    <text x="512" y="149" text-anchor="middle" class="small" fill="#ffffff">READY</text>

    <line x1="755" y1="85" x2="865" y2="85" stroke="#7d8998" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="880" y="0" width="300" height="170" rx="20" fill="#f5f7fa" stroke="#c8d1dc" stroke-width="2"/>
    <text x="908" y="46" class="label">运行记录</text>
    <text x="908" y="84" class="body">原始请求、缺失字段、</text>
    <text x="908" y="114" class="body">确认来源、状态与原因</text>
    <text x="908" y="148" class="mono">run_record.json</text>
  </g>

  <!-- Guardrail -->
  <rect x="109" y="770" width="1380" height="48" rx="14" fill="#f0f2f5"/>
  <text x="799" y="801" text-anchor="middle" class="body">READY 只表示任务信息足够完整；执行、评审、发布和签发仍未发生。</text>
</svg>
